serial_number: w200-0000
version: 0
system:
  hosts:
    - hostname: cpr-w200-0000
      ip: 192.168.131.1
  ros2:
    namespace: w200_0000
    workspaces:
    - /root/clearpath_ws/install/setup.bash
links:
  box:
    - name: structure
      size: [0.5, 0.675, 0.5]
    - name: tower
      size: [0.15, 0.15, 0.15]
      parent: structure_link
      xyz: [0.0, 0.0, 0.5]


sensors:
  lidar3d:
  - model: velodyne_lidar
    urdf_enabled: true
    launch_enabled: true
    parent: base_link
    xyz: [0.0, 0.0, 1.0]
    rpy: [0.0, 0.0, 0.0]
    ros_parameters:
      velodyne_driver_node:
        frame_id: lidar3d_0_laser
        device_ip: 192.168.131.25
        port: 2368
        model: 32C
      velodyne_transform_node:
        model: 32C
        calibration: "/opt/ros/humble/share/\
          velodyne_pointcloud/params/VeloView-VLP-32C.yaml"
        fixed_frame: lidar3d_0_laser
        target_frame: lidar3d_0_laser
  camera:
  - model: intel_realsense
    urdf_enabled: true
    launch_enabled: true
    parent: base_link
    xyz: [0.0, 0.5, 0.8]
    rpy: [0.0, 0.0, 0.0]
  - model: intel_realsense
    urdf_enabled: true
    launch_enabled: true
    parent: base_link
    xyz: [0.0, -0.5, 0.8]
    rpy: [0.0, 0.0, 0.0]
  imu:
  - model: microstrain_imu
    urdf_enabled: true
    launch_enabled: true
    parent: base_link
    xyz: [0.0, 0.0, 0.8]
    rpy: [0.0, 0.0, 0.0]
